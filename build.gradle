plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()

	maven {
		url = "https://www.dcm4che.org/maven2"
	}

	maven {
		url = "https://raw.githubusercontent.com/nroduit/mvn-repo/master/"
	}
}

configurations {
	opencvNative
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"medicalimages" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


	// =========================
	// NIfTI
	// =========================

	implementation "ch.unibas.cs.gravis:scalismo-niftijiojar:0.1.0"
	include "ch.unibas.cs.gravis:scalismo-niftijiojar:0.1.0"


	// =========================
	// DICOM
	// =========================

	implementation "org.dcm4che:dcm4che-core:5.35.1"
	include "org.dcm4che:dcm4che-core:5.35.1"

	implementation "org.dcm4che:dcm4che-image:5.35.1"
	include "org.dcm4che:dcm4che-image:5.35.1"

	implementation "org.dcm4che:dcm4che-imageio:5.35.1"
	include "org.dcm4che:dcm4che-imageio:5.35.1"

	implementation "org.dcm4che:dcm4che-imageio-opencv:5.35.1"
	include "org.dcm4che:dcm4che-imageio-opencv:5.35.1"

	implementation "org.weasis.core:weasis-core-img:5.0.0"
	include "org.weasis.core:weasis-core-img:5.0.0"

	opencvNative "org.weasis.thirdparty.org.opencv:opencv_java:5.0.0-dcm:windows-x86-64@dll"
}

tasks.register("copyOpenCvNative", Copy) {
	from configurations.opencvNative

	into layout.projectDirectory.dir("run/opencv")

	rename {
		"opencv_java.dll"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	from(configurations.opencvNative) {
		into "natives/windows-x86-64"

		rename {
			"opencv_java.dll"
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}